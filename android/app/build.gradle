plugins { id 'com.android.application' }
android {
    namespace 'com.jacobsides.hands'
    compileSdk 35
    defaultConfig { applicationId 'com.jacobsides.hands'; minSdk 33; targetSdk 35; versionCode 2; versionName '2.0.0'; testInstrumentationRunner 'android.test.InstrumentationTestRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        personal {
            storeFile file(System.getenv('HANDS_KEYSTORE') ?: "${System.getProperty('user.home')}/.local/share/history-of-hands/release.keystore")
            storePassword System.getenv('HANDS_STORE_PASSWORD')
            keyAlias 'hands'
            keyPassword System.getenv('HANDS_STORE_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.personal; minifyEnabled false } }
}

dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
